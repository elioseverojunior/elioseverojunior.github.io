[project]
name = "profile-data"
version = "0.1.0"
description = "Fetch User Download Data from Crates.io and Terraform Registry"
readme = "README.md"
authors = [
    { name = "Elio S. Jr", email = "elioseverojunior@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
profile-data = "fetch_downloads:main"

# Without a build backend uv treats this as a virtual project and never
# installs [project.scripts], so `profile-data` would not resolve.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["fetch_downloads.py"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "ruff>=0.9",
]

# target-version is pinned rather than inferred. Ruff otherwise formats against
# whatever interpreter happens to be on PATH, and the 3.14-only syntax it emits
# (PEP 758 unparenthesised `except A, B:`) is a SyntaxError on every earlier
# version — a silent compatibility change made by a formatter run.
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # `object` is the honest type for an unvalidated JSON payload
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright header convention in this repo
    "D203",    # mutually exclusive with D211
    "D213",    # mutually exclusive with D212
    "EM101",   # short literal messages read better inline
    "EM102",
    "PERF203", # try/except in a loop is the shape of a retry
    "PLR0913",
    "T201",    # the summary report is intentionally printed to stdout
    "TRY003",
]

[tool.mypy]
python_version = "3.14"
strict = true
