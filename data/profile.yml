    featured: true
    bullets:
      - "Tuned Karpenter-based autoscaling and cluster ingress to absorb variable demand without over-provisioning."
      - "Gated production deployment with Semgrep and Snyk scanning, SonarQube quality gates, SOPS-encrypted Helm secrets and ArgoCD sync policies."
      - "Moved application delivery onto declarative GitOps, with ArgoCD reconciling Helm releases against Git so live EKS state could not drift from the committed source."
