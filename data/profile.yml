# docker and kind under elioseverojunior.
projects:
  - {id: rust-yaml, name: rust-yaml, kind: crate,
     url: "https://crates.io/crates/rust-yaml",
     summary: native YAML parsing crate published to crates.io}
  - {id: glaucus, name: glaucus, kind: crate,
     url: "https://crates.io/crates/glaucus",
     summary: Safe YAML for Rust — zero unsafe by default, full YAML 1.2.2 spec compliance, high performance}
  - {id: comply, name: comply, kind: crate,
     url: "https://crates.io/crates/comply",
     summary: "REUSE Specification compliance tool and library: lint, annotate, and fix SPDX license headers"}
  - {id: ignorefile, name: ignorefile, kind: crate,
     url: "https://crates.io/crates/ignorefile",
     summary: native YAML parsing crate published to crates.io}
  - {id: terraform-provider-strcase, name: strcase Terraform provider, kind: terraform-provider,
     url: "https://registry.terraform.io/providers/elioseverojunior/strcase/latest/docs",
     summary: official Terraform Registry provider that supplies string case conversion functions to Terraform configurations}
  - {id: terraform-provider-sops, name: SOPS Terraform provider, kind: terraform-provider,
     url: "https://registry.terraform.io/providers/elioetibr/sops/latest/docs",
     summary: official Terraform Registry provider that lets practitioners decrypt SOPS-managed secrets natively inside Terraform plans}
  - {id: terraform-provider-dnsmasq, name: dnsmasq Terraform provider, kind: terraform-provider,
     url: "https://registry.terraform.io/providers/elioetibr/dnsmasq/latest/docs",
     summary: official Terraform Registry provider that brings local DNS record management under declarative infrastructure as code}
  - {id: terraform-provider-docker, name: Docker Terraform provider, kind: terraform-provider,
     url: "https://registry.terraform.io/providers/elioseverojunior/docker/latest/docs",
     summary: official Terraform Registry provider that manages container lifecycle and image resources declaratively}
  - {id: terraform-provider-kind, name: kind Terraform provider, kind: terraform-provider,
     url: "https://registry.terraform.io/providers/elioseverojunior/kind/latest/docs",
     summary: official Terraform Registry provider that provisions ephemeral Kubernetes-in-Docker clusters for CI and local test harnesses}
