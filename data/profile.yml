  - id: nutrien
    employer: Nutrien Agriculture Solutions
    industry: agribusiness
    start: 2022-04
    end: 2023-09
    titles: ["SRE Cloud Engineering Manager"]
    featured: true
    bullets:
      - "Led the LATAM Cloud Engineering cross-squad team supporting downstream software and data engineering squads, building a high-density automation framework rather than growing headcount."
      - "Architected multi-account hub-and-spoke infrastructure across AWS, Azure and GCP using Transit Gateway, VPC, VPN and centralized identity, consolidating shared data platform services including data lakes, Glue, Lambda, RDS and Redshift."
      - "Established platform self-service patterns and GitHub Actions reusable workflows that replaced batch releases with continuous production delivery."
      - "Drove FinOps rightsizing, automated resource lifecycle management and decommissioning, reporting spend directly to the director."
      - "Mentored senior and junior engineers into end-to-end incident ownership."
    tech: [gh-actions, typescript, aws, azure, gcp, glue, rds, redshift, hcp-terraform, sentinel, argocd, argo-rollouts]
    metrics:
      # Named for the release *interval*, not DORA lead-time-for-changes:
      # what was measured is how often production shipped, not how long a
      # commit took to get there. The two happen to yield the same percentage
      # under a fixed release train -- average wait is half the interval, so
      # both scale together -- which is precisely why the id has to say which
      # one it is.
      - id: deployment-cadence-cut
        value: 75
        unit: percent
        claim: >-
          shortened the production release interval from every two months to
          every two weeks, using GitHub Actions reusable workflows, custom
          TypeScript actions and platform self-service patterns, with ArgoCD
          and Argo Rollouts making off-cycle hotfixes routine
      - id: cloud-cost-reduction
