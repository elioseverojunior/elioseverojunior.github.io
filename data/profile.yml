# The figures led with, in the order they are shown.
#
# `metrics` holds ids from `experience[].metrics` rather than the numbers
# themselves, so a figure is written down exactly once -- in the role that
# earned it -- and this block only chooses which ones lead. Listing more than
# one id sums them, which is how 216 non-production and 27 production
# migrations are presented as the single 243 they were. A mistyped id fails the
# build; a restated number would just drift, which is precisely what happened
# when this block carried its own copies.
#
# `label` and `detail` stay hand-written: which mechanism is worth naming is a
# judgement, not a measurement.
impact:
  - metrics: [eks-migration-non-production, eks-migration]
    label: core applications migrated from legacy KOPS to AWS EKS 1.33
    detail: zero customer-facing downtime via Route53 weighted routing, Argo Rollouts and Istio traffic shifting
  - metrics: [ec2-spend-reduction]
    label: EC2 spend reduction
    detail: Karpenter consolidation, ARM64 Graviton node pools and automated spot execution
  - metrics: [cloud-cost-reduction]
    label: LATAM cloud operating cost reduction
    detail: FinOps rightsizing, automated resource lifecycle management and decommissioning
  - metrics: [deployment-cadence-cut]
    label: deployment lead-time reduction
    detail: quarterly release batches replaced by continuous production delivery

# Display grouping for the Stack section. `skills` below is the authoritative
# flat record with depth ratings; this is purely how those names are bucketed
