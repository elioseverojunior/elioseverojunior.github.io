# `prominence` is how central a skill is to how this career is presented.
# Optional; absent means "do not feature". Vendor-neutral by design -- it is a
# property of the career, not of one consumer, so any company's rules.yaml may
# order by it. A field named for a single consumer would invite one per vendor
# and turn this file into a junk drawer.
#
#   1  lead with this; the thing I want to be found for
#   2  include; core to the work
#   3  include if there is room
#
# Independent of `level` on purpose: `level` is how well the work is done,
# `prominence` is whether it is the direction being travelled. The two come
# apart -- a level-5 legacy tool would reasonably stay prominence-absent,
# while a level-4 skill that is the direction of travel would reasonably be
# prominence 1. No skill carries a prominence value yet; assigning them is
# an editorial pass over this file.

# `level` is a self-assessment on a 1-5 scale -- the one field in this file
# that no instrument produced, and the only reason it is allowed here is that
# it is not a claim about an outcome. It exists because vendor competency
# files (PrimeIT's, for one) require a proficiency column, and a rating
# invented at render time would be unreviewable: it would differ between two
# renders of the same career. Stated once here, it is reviewed once and
# reused by every company. How a company prints it is that company's concern
# -- see companies/primeit.pt/rules.yaml for the labels PrimeIT attaches.
#
#   5  daily working tool; designs, owns and debugs it unaided in production
#   4  delivered to production unaided
#   3  working knowledge; delivered with support, or in an earlier role
#   2  familiar; used incidentally, or superseded years ago
#   1  aware only
