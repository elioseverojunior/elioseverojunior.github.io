impact:
  - metric: "243"
    label: core applications migrated from legacy KOPS to AWS EKS 1.33
    detail: zero customer-facing downtime via Route53 weighted routing, Argo Rollouts and Istio traffic shifting
  - metric: 35%
    label: EC2 spend reduction
    detail: Karpenter consolidation, ARM64 Graviton node pools and automated spot execution
  - metric: ~60%
    label: mean-time-to-detect reduction on production incidents
    detail: observability codified as infrastructure across Grafana Cloud, Loki, Prometheus, Datadog and OpenTelemetry
  - metric: 83%
    label: deployment lead-time reduction
    detail: quarterly release batches replaced by twice-monthly production delivery

projects:
  crates:
    - name: rust-yaml
      repo: elioetibr/rust-yaml
      summary: Fast, safe YAML 1.2 library for Rust
  terraform_providers:
    - namespace: elioseverojunior
      name: strcase
      repo: elioseverojunior/terraform-provider-strcase
      summary: String case conversion functions for Terraform
    - namespace: elioseverojunior
      name: kind
      repo: elioseverojunior/terraform-provider-kind
      summary: Ephemeral Kubernetes-in-Docker clusters for CI and local test harnesses
    - namespace: elioseverojunior
      name: docker
      repo: elioseverojunior/terraform-provider-docker
      summary: Declarative container lifecycle and image resources
    - namespace: elioetibr
      name: dnsmasq
      repo: elioetibr/terraform-provider-dnsmasq
      summary: Local DNS record management as infrastructure as code
    - namespace: elioetibr
      name: sops
      repo: elioetibr/terraform-provider-sops
      summary: Native decryption of SOPS-managed secrets inside Terraform plans
  # Published too recently for a download figure to carry information. These are
  # announced beneath the downloads table rather than listed in it: everything
  # under `crates` above is both a table row and a term in the combined total
  # the section headlines, so a just-published project would sit as a near-zero
  # row directly under the strongest claim on the page. `crates` here still
  # feeds the crates.io badge count, so the work is counted without being
  # measured on a number that has had no time to mean anything.
  recent:
    - name: comply
      summary: REUSE/SPDX compliance tooling for Rust
      repo: elioseverojunior/comply
      shipped: July 2026
      crates:
        - comply
        - comply-cli

