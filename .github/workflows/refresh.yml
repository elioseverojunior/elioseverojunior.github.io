name: Refresh

on:
  schedule:
    # Mondays 06:17 UTC. The odd minute keeps the run off the top of the hour,
    # where GitHub's scheduler is most heavily contended and most likely to
    # delay or drop a cron trigger.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Nothing is granted by default. The job below asks for exactly what it uses.
permissions: {}

# A weekly run overlapping a manual one would have two runs racing to publish
# the same content. Queue instead, and never cancel: publish.yml's own
# concurrency comment covers why a publish in flight is the one thing not worth
# interrupting.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  republish:
    # A rebuild is the whole job. publish.yml refreshes the registry download
    # counts before it builds, so the weekly run picks up new figures simply by
    # building again — there is no cache to commit here and nothing to push.
    #
    # This job used to fetch and commit data/.download-cache.json itself. That
    # stopped being possible when data/ became the profile-data submodule: the
    # file belongs to another repository now, so committing it from here would
    # need write access to that repo and a gitlink bump in this one — to
    # persist a figure the next build re-fetches anyway.
    #
    # No `ref` is passed for the same reason: nothing commits ahead of the
    # build any more, so checkout's default (the ref that triggered the run) is
    # already the newest thing there is.
    #
    # A called workflow can only narrow the calling workflow's token, never
    # widen it, so publish.yml's deploy job cannot grant itself the pages and
    # id-token access it needs. That has to be granted here, at the call site.
    permissions:
      contents: read
      pages: write
      id-token: write
    # APP_PRIVATE_KEY has to reach the called workflow, or it cannot mint the
    # App token its checkout needs to read the private profile-data submodule.
    # `vars` needs no equivalent — repository variables are visible to a called
    # workflow already; only secrets have to be passed deliberately.
    secrets: inherit
    uses: ./.github/workflows/publish.yml
