name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: >-
          Branch, tag or SHA to build. Left empty, actions/checkout falls back
          to the ref that triggered the run, which is what every caller wants
          today — nothing commits ahead of the build any more, so the
          triggering ref is already the newest thing there is. Kept as an input
          so a specific commit can be republished by hand without reverting.
        type: string
        required: false
        default: ""

# GitHub serves one Pages deployment at a time, so overlapping runs queue rather
# than race. They are never cancelled mid-flight: a run cancelled between the
# artifact upload and the deployment leaves the live site on the previous build
# with nothing queued to retry it.
concurrency:
  group: pages
  cancel-in-progress: false

# Nothing is granted by default. Each job below asks for exactly what it uses.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A GitHub App installation token, minted for this run and revoked when
      # the job ends. It exists because profile-data is private and the default
      # workflow token is scoped to this repository alone, so the submodule
      # fetch 403s with it.
      #
      # An App rather than a PAT: the credential is short-lived, its scope is
      # declared here in the workflow instead of remembered in someone's
      # account settings, and it is not tied to a person who might lose access.
      # `client-id`, not the deprecated `app-id`. APP_CLIENT_SECRET is not used
      # — that is for the OAuth web flow, not installation tokens.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Both repositories, not just profile-data: checkout authenticates
          # the superproject fetch with this same token, and one scoped to the
          # submodule alone cannot clone the repository it is checking out.
          repositories: |
            elioseverojunior.github.io
            profile-data
          # Reading source is the whole job. Naming it keeps the token narrow
          # even if the App itself is granted more.
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # data/ is the profile-data submodule and holds every fact this site
          # renders, so without it the build fails on a missing profile.yml
          # rather than producing a thinner page.
          submodules: recursive
          # .gitmodules records an SSH URL; checkout rewrites it to HTTPS and
          # authenticates with this token, which is why no deploy key is needed.
          token: ${{ steps.app-token.outputs.token }}

      # Build from the tip of profile-data's main, not the commit pinned here.
      #
      # The record is content, not a code dependency. It is edited far more
      # often than this site, and a pinned gitlink means every edit needs a bump
      # commit here before it can reach the page — which is precisely how the
      # last build broke: the record gained four skills, the bump was dropped
      # by an IDE rebase, and CI faithfully rendered the older record.
      #
      # The cost is reproducibility. Rebuilding an old commit of this repo now
      # renders today's record rather than the one it was written against, and
      # a bad edit in profile-data can break this site with no change here. That
      # trade is taken deliberately: a CV wants to be current far more than it
      # wants to be re-creatable, and the gitlink still pins local development
      # so `bun run build` on a fresh clone is not chasing a moving target.
      #
      # `--remote` follows the `branch = main` already declared in .gitmodules;
      # without it this would re-checkout the same pinned commit and do nothing.
      - name: Advance the record to the tip of profile-data
        run: git submodule update --remote --recursive data

      # Installs the mise-managed tools, restores the Bun cache, installs with
      # --frozen-lockfile and audits blocked post-install scripts. It also
      # applies the github-actions[bot] git identity via bot-setup — unused in
      # this job, which commits nothing, but the composite is deliberately one
      # entry point rather than two so no job can skip half of it.
      #
      # --frozen-lockfile matters here because bunfig.toml leaves it off:
      # adding a dependency locally has to be allowed to update the lockfile,
      # whereas a CI build that quietly resolves something other than bun.lock
      # is a build nobody can reproduce.
      - uses: ./.github/actions/setup

      # Before the build, because the build reads the cache this writes. The
      # registries are public, so no credentials are involved.
      #
      # The script keeps the previous figure for any package it cannot reach
      # and exits non-zero only when every lookup fails, so a transient outage
      # publishes slightly stale figures rather than zeroing the strongest
      # evidence on the page. It writes into data/, which is the submodule
      # working tree — nothing commits that here; the figures are baked into
      # the rendered HTML and the checkout is discarded with the runner.
      - name: Refresh registry download counts
        run: bun run fetch:downloads

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # docusaurus build exits non-zero on a render failure, so this is a floor
      # check rather than the primary guard — the case it covers is a future
      # regression that exits 0 on truncated output. Never add continue-on-error
      # or "|| true" here: doing so would publish unverified output over a
      # working site.
      - name: Verify the built site
        run: |
          set -euo pipefail

          for required in build/index.html build/cv.html; do
            test -s "$required" || {
              echo "::error::$required is missing or empty; refusing to publish."
              exit 1
            }
          done

          # docusaurus.config.ts sets onBrokenAnchors to 'warn' because these
          # ids are emitted by React section components, and Docusaurus' anchor
          # checker only collects anchors it can extract from Markdown headings.
          # That leaves nothing to catch a renamed section id except this, and
          # a navbar whose links silently scroll nowhere is the failure mode.
          #
          # The quotes are optional in the pattern because the production
          # minifier drops them: this page ships `id=impact>`, not `id="impact">`.
          for anchor in impact history stack shipped; do
            grep -qE "id=\"?${anchor}\"?[ />]" build/index.html || {
              echo "::error::the navbar links to #$anchor, but the built page has no element with that id."
              exit 1
            }
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the Pages deployment, and minting the OIDC token that
      # deploy-pages exchanges for permission to create it. Neither is implied
      # by the default workflow token.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deploy
